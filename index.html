<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulut Teknoloji</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f0f5fa;
      color: #243247;
      text-align: center;
    }
    header {
      background-color: #174ea6;
      color: white;
      padding: 50px 20px;
    }
    main {
      padding: 40px 20px;
    }
    .kutu {
      background: white;
      padding: 25px;
      margin: 20px auto;
      max-width: 550px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000015;
    }
    footer {
      padding: 20px;
      background: #243247;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bulut Teknoloji</h1>
    <p>Geleceğin Teknolojisi, Bugünün Çözümleri</p>
  </header>
  <main>
    <h2>Şirketimize Hoş Geldiniz</h2>
    <p>Bulut bilişim çözümleri sunuyoruz.</p>
    <div class="kutu">
      <h3>Hizmetlerimiz</h3>
      <p>Bulut Depolama</p>
      <p>Sunucu Yönetimi</p>
      <p>Veri Yedekleme</p>
    </div>
    <div class="kutu">
      <h3>Hakkımızda</h3>
      <p>İşletmelerin dijital dönüşümüne destek oluyoruz.</p>
    </div>
  </main>
  <footer>
    <p>2026 Bulut Teknoloji - Eğitim Projesi</p>
  </footer>
</body>
</html>
